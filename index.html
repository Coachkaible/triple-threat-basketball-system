<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Triple Threat Basketball System — Offense + Defense</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f2b134">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triple Threat">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
:root{--bg:#101419;--panel:#182029;--ink:#f7f7f4;--muted:#aeb8c2;--accent:#f2b134;--court:#d7a86e;--line:#fff;--good:#55c97a;--bad:#ef6b67}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{padding:18px 22px;background:#0b0f13;border-bottom:1px solid #29323b} h1{margin:0;font-size:22px} header p{margin:5px 0 0;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(380px,1.4fr) minmax(300px,.8fr);gap:18px;padding:18px;max-width:1200px;margin:auto}
.card{background:var(--panel);border-radius:16px;padding:16px;box-shadow:0 8px 30px #0004}
.tabs,.controls,.players{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:#2a3540;color:white}
button.active,button.primary{background:var(--accent);color:#151515} button:disabled{opacity:.4;cursor:not-allowed}
#court{width:100%;aspect-ratio:50/47;background:var(--court);border-radius:12px;display:block}
.stage{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;align-items:start}
.slide-notes{min-height:470px;display:flex;flex-direction:column;gap:10px}
.note-bubble{background:#111820;border:1px solid #2b3641;border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px #0003}
.note-title{font-size:12px;font-weight:800;color:#f7f7f4;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.note-line{font-size:12px;line-height:1.35;color:#cfd8e1;font-weight:700}
.note-bubble.accent .note-title{color:#f2b134}
.note-bubble.accent{border-color:#5a4722}
@media (max-width: 980px){
  .stage{grid-template-columns:1fr}
  .slide-notes{min-height:auto;order:2}
}
.player{transition:all .55s ease}.ball{transition:all .45s ease}
h2{margin:0 0 10px;font-size:19px}.lesson{color:var(--muted);line-height:1.45;min-height:120px}
.rule{padding:11px;border-left:4px solid var(--accent);background:#111820;border-radius:8px;margin:12px 0}
.status{font-weight:800;color:var(--accent);margin:10px 0}.quiz button{display:block;width:100%;text-align:left;margin:7px 0}
.small{font-size:13px;color:var(--muted)} .focus{outline:4px solid var(--accent);outline-offset:2px}
.legend{margin-top:12px;padding:12px;background:#111820;border-radius:10px}
.legend h3{margin:0 0 8px;font-size:14px}
.legend-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px;color:var(--muted)}
.legend svg{flex:0 0 auto}
#playBtn,#pauseBtn,#restartPlayBtn{white-space:nowrap}
#speedSelect{cursor:pointer}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
</style>
<!-- DEFENSE V61 STYLES START -->
<style id="defenseV61Styles">
.system-switch{position:absolute;right:18px;top:11px;display:flex;gap:6px;z-index:10}
.system-switch button{padding:7px 12px;border-radius:9px;font-size:11px;background:#2a3540;color:#fff;border:1px solid #394754}
.system-switch button.active{background:var(--accent);color:#151515;border-color:var(--accent)}
.defense-job-card{padding:11px;border-left:4px solid var(--accent);background:#111820;border-radius:8px;margin:10px 0;font-size:13px;line-height:1.35}
.defense-job-card b{color:#fff}
.defense-core{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.defense-core div{background:#111820;border:1px solid #2b3641;border-radius:8px;padding:7px;font-size:11px;font-weight:700;color:#cfd8e1}

.defense-level-switch{display:none;gap:5px;margin-left:auto}
.defense-level-switch button{padding:7px 10px!important;font-size:10px!important;border:1px solid #45515d;background:#202a34}
.defense-level-switch button.active{background:#f7f7f4;color:#151515;border-color:#f7f7f4}
@media(max-width:1049px){.defense-level-switch{width:100%;margin-top:4px;margin-left:0}.defense-level-switch button{flex:1}}
@media(min-width:1050px) and (max-height:760px){.defense-level-switch button{padding:5px 7px!important;font-size:8.5px!important}}
@media(max-width:1049px){
  header{position:relative;padding-right:16px}
  .system-switch{position:static;margin-top:8px}
  header{height:auto}
}
@media(min-width:1050px) and (max-height:760px){
  .system-switch{right:14px;top:8px}.system-switch button{padding:5px 9px;font-size:9px}
}
</style>
<!-- DEFENSE V61 STYLES END -->

</head>
<body>
<header><h1>Interactive Basketball Offense</h1><p id="sectionName">SECTION 1 · BASE MOTION</p></header>
<div class="wrap">
<section class="card">
<div class="tabs">
<button id="watchTab" class="active" onclick="setMode('watch')">WATCH IT</button>
<button id="jobTab" onclick="setMode('job')">LEARN MY JOB</button>
<button id="quizTab" onclick="setMode('quiz')">TEST ME</button>
</div>
<div style="height:12px"></div>
<div class="stage">
  <div id="slideNotes" class="slide-notes"></div>
  <svg id="court" viewBox="0 0 500 470" aria-label="Basketball half court">
  <image href="data:image/png;base64,PLACEHOLDER" x="0" y="0" width="500" height="470" preserveAspectRatio="none"/>
  </svg>
</div>
</div>
</section>
</div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch(err => console.log("SW failed", err));
  });
}
</script>
</body>
</html>
